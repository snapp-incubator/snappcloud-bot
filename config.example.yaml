# snappcloud-bot — SnappCloud Mattermost bot.
#
# Connects to Mattermost (WebSocket). It runs the MCP tool-calling agent
# in-process (no Dify): a reasoning model drives the per-cluster MCP servers and
# the bot enforces namespace scope on every tool result. Authorization is
# delegated to the per-region mcp-authz API — the bot holds no cluster creds.
#
# Secrets are read from the environment (never in YAML):
#   MATTERMOST_TOKEN, LLM_API_KEY, MCP_AUTHZ_TOKEN, and any MCP server auth vars.

mattermost:
  url: https://mattermost.example.com
  tokenEnv: MATTERMOST_TOKEN
  identityMap: {}
  # Channels: answer only when @-mentioned. DMs: always answered. Default true.
  requireMention: true

# Abuse guards for client access.
# Optional HTTP query API (same enforced agent loop, outside Mattermost).
# Callers send their own OpenShift user or ServiceAccount token as a bearer.
api:
  enabled: false
  addr: ":8081"
  timeout: 5m

# User-defined recurring queries. Each run costs an LLM call plus MCP calls.
schedules:
  enabled: false
  path: /data/schedules.json
  perUser: 5
  total: 200
  minInterval: 1h
  concurrency: 2
  timeout: 5m

limits:
  ratePerMin: 20
  rateBurst: 5
  maxQueryRunes: 4000

memory:
  # Per-thread conversation memory.
  conversationTTL: 1h
  # Persist thread/DM -> memory transcript to this file so users can continue past
  # conversations across bot restarts. Put it on a PVC. Empty = in-memory.
  memoryPath: /data/conversations.json

authz:
  tokenEnv: MCP_AUTHZ_TOKEN
  cacheTTL: 5m
  timeout: 30s
  # One mcp-authz endpoint per cluster. `name` MUST match an agent.clusters[].name.
  regions:
    - name: prod-1
      url: https://mcp-authz.prod-1.example.com
    - name: staging-1
      url: https://mcp-authz.staging-1.example.com

agent:
  llm:
    baseURL: https://llm.example.com/anthropic
    apiKeyEnv: LLM_API_KEY
    model: zai/glm-5.2
    maxTokens: 8192
    version: "2023-06-01"
    timeout: 10m
  # Optional backup model. When the primary fails repeatedly the bot serves
  # from this one, then probes the primary again after cooldownPeriod and
  # switches back on its own. Only `model` is required — everything else
  # inherits from `llm` above. Omit the block to disable failover.
  fallbackLLM:
    model: zai/glm-5.2
    failureThreshold: 3      # consecutive primary failures before switching
    cooldownPeriod: 5m       # backup serves this long before re-probing
  maxIterations: 8
  # Bot identity + greeting/help behavior (SnappCloud default if omitted).
  # persona: |
  # systemPrompt: |    # optional; OVERRIDES the built-in default entirely
  # MCP tool-usage skills appended to every prompt. See the deployed helm values
  # for the full text (synthesized from each server's skill file).
  toolGuidance: ""
  # systemPrompt: |   # optional; a built-in default is used when omitted

  # Per-cluster MCP servers. `name` MUST match an authz.regions[].name. `alias`
  # prefixes the cluster's tool names for the model (short = shorter tool names).
  # authHeaderEnv names an env var holding the full Authorization header value
  # (e.g. "Basic ...") — omit for no auth.
  # selfAuthorized: true marks a trusted, identity-aware server (e.g. argocd-mcp):
  # the caller's identity is forwarded as X-Remote-User and the server scopes its
  # own results, so the bot skips namespace filtering for its tools. Off by default.
  # unscoped: true marks a server whose results every user authorized on the
  # cluster may see in full (no namespace enforcement, PromQL pinning or result
  # filtering; allowTools and clusterAdminOnly toolRules still apply). Use it only
  # for data you are willing to show every tenant, e.g. Prometheus metrics while
  # investigations need cluster-wide context. Off by default.
  # names: what else the cluster is called outside the bot — the cluster/region
  # label on your alerts, the Grafana datasource, what people say. The bot maps
  # them to this cluster so the model never mistakes a spelling for a missing
  # permission. The name, alias and the name without an okd4- prefix are always
  # recognised.
  clusters:
    - name: prod-1
      alias: teh1
      names: [prod-teh-1, teh-1]
      servers:
        - url: https://cilium-mcp.prod-1.example.com/mcp
          authHeaderEnv: CILIUM_TEH1_AUTH
        - url: https://contour-envoy-mcp.prod-1.example.com/mcp
        # - url: https://argocd-mcp.prod-1.example.com/mcp
        #   selfAuthorized: true
        # - url: https://grafana-mcp.prod-1.example.com/mcp
        #   unscoped: true          # every tenant sees every metric
    - name: staging-1
      alias: ts3
      servers:
        - url: https://cilium-mcp.staging-1.example.com/mcp
        - url: https://contour-envoy-mcp.staging-1.example.com/mcp

  # Global MCP servers — namespace-agnostic, available to every authorized user
  # regardless of cluster, not scope-filtered (e.g. the general SnappCloud docs).
  globalServers:
    # alias groups a global server's tools under a [alias] tag (default "docs").
    # Servers sharing an alias merge; distinct aliases are separate tool groups.
    - url: https://chatbot-services.prod-1.example.com/mcp/server/Akksh5w2yAKrPzou/mcp
      alias: docs

  # Optional per-tool rules: namespace-arg overrides (default: arg "namespace",
  # plain) and clusterAdminOnly for cluster-infrastructure tools whose output is
  # admin-gated infrastructure data (see the deployed helm values for the list). Most tools take no namespace arg — enforcement is on the
  # RESULT data — so this is usually empty.
  toolRules: {}
    # get_pod:
    #   namespaceArgs: [pod]
    #   format: slash          # value is "namespace/name"
    #   requireNamespace: true
